<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практична робота 3 — Користувачі API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 35px auto; padding: 0 18px; background: #f5f7fa; color: #222; }
    h1 { color: #243b55; }
    button { padding: 10px 16px; cursor: pointer; border: 0; border-radius: 6px; background: #315b96; color: white; }
    button:hover { background: #244675; }
    #status { margin: 16px 0; }
    ul { padding: 0; list-style: none; }
    li { background: white; margin: 10px 0; padding: 14px; border-radius: 8px; box-shadow: 0 1px 4px #ddd; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Список користувачів</h1>
  <p>Користувачі з міста Gwenborough, відсортовані за ім'ям.</p>
  <button id="reloadButton">Завантажити ще раз</button>
  <p id="status">Завантаження...</p>
  <ul id="usersList"></ul>
  <script type="module" src="main.js"></script>
</body>
</html>
